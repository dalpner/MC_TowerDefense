name: Build mod and modpack

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Als Release veröffentlichen mit diesem Versions-Tag, z. B. v1.0.0 (leer lassen = nur bauen)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test the mod
        working-directory: mod
        run: ./gradlew build --stacktrace

      - name: Smoke test on a dedicated server
        working-directory: mod
        timeout-minutes: 15
        run: |
          set -o pipefail
          mkdir -p build/smoketest
          echo "eula=true" > build/smoketest/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\ngenerate-structures=false\nmax-tick-time=-1\n' > build/smoketest/server.properties
          ./gradlew runSmokeTest --stacktrace 2>&1 | tee smoketest.log
          grep -q "\[SmokeTest\] PASSED" smoketest.log

      - name: Client test (headless, software rendering)
        working-directory: mod
        timeout-minutes: 25
        run: |
          set -o pipefail
          if ! command -v xvfb-run > /dev/null; then sudo apt-get update && sudo apt-get install -y xvfb; fi
          mkdir -p build/clienttest
          printf 'version:3955\nlang:de_de\nonboardAccessibility:false\npauseOnLostFocus:false\ntutorialStep:none\nrenderDistance:6\nsimulationDistance:6\nnarrator:0\n' > build/clienttest/options.txt
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientTest --stacktrace 2>&1 | tee clienttest.log
          grep -q "\[ClientTest\] PASSED" clienttest.log

      - name: Upload client test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-test-screenshots
          path: mod/build/clienttest/screenshots/
          if-no-files-found: ignore

      - name: Build the modpack
        run: |
          JAR=$(ls mod/build/libs/mctd-*.jar | grep -v -- '-sources' | head -n 1)
          python3 modpack/build_mrpack.py --mod-jar "$JAR" --out dist --server-zip
          cp "$JAR" dist/

      - name: Smoke test the server zip (production jars from the modpack)
        timeout-minutes: 15
        run: |
          set -o pipefail
          mkdir prodtest
          cd prodtest
          unzip -q ../dist/MC-Tower-Defense-Server-*.zip
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\ngenerate-structures=false\nmax-tick-time=-1\n' > server.properties
          java -Xmx2G -Dmctd.smoketest=true -jar fabric-server-launch.jar nogui 2>&1 | tee ../prodtest.log
          grep -q "\[SmokeTest\] PASSED" ../prodtest.log

      - uses: actions/upload-artifact@v4
        with:
          name: mc-tower-defense
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: MC Tower Defense ${{ inputs.release || github.ref_name }}
          body: |
            **Spielen:** `MC-Tower-Defense-*.mrpack` herunterladen und in Prism Launcher oder der Modrinth App
            importieren. **Eigener Server:** `MC-Tower-Defense-Server-*.zip`. Die Schritt-für-Schritt-Anleitung
            steht in der [README](https://github.com/${{ github.repository }}#readme).
          files: dist/*
