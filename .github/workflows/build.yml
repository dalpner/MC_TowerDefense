name: Build mod and modpack

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test the mod
        working-directory: mod
        run: ./gradlew build --stacktrace

      - name: Build the modpack
        run: |
          JAR=$(ls mod/build/libs/mctd-*.jar | grep -v -- '-sources' | head -n 1)
          python3 modpack/build_mrpack.py --mod-jar "$JAR" --out dist --server-zip
          cp "$JAR" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: mc-tower-defense
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
